name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python src/synthetic_data.py

      - name: Run test suite
        run: pytest tests/ -v

      - name: Run evaluation scripts (methodology check, non-blocking output)
        run: |
          python tests/evaluation.py
          python tests/segmentation_eval.py

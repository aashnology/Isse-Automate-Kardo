<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isse Automate Kardo — Hexi</title>
<link rel="stylesheet" href="/retro.css">
<link rel="stylesheet" href="/book.css">
</head>
<body>

<div class="frame">
  <div class="titlebar">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="url">Isse Automate Kardo</div>
  </div>

  <div class="hud" id="hud" aria-label="Player progress">
    <div class="lv" id="hudLevel">LV 1</div>
    <div class="xp"><span id="hudXpText">XP 0 / 100</span><div class="bar"><i id="hudXpBar" style="--pct:0"></i></div></div>
    <div class="stat">Est. h / week saved<b id="hudHours">0.0</b></div>
    <div class="stat">Trophies<b id="hudTrophies">0 / 6</b></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-workflow="bug_triage">Ticket queue</button>
    <button class="tab" data-workflow="weekly_reporting">Spreadsheet</button>
    <button class="tab" data-workflow="onboarding_new_partner">Inbox</button>
    <button class="tab" data-workflow="import">My data</button>
  </div>

  <div class="panel" id="panel"><p class="status">Pick a quest tab to load its real step breakdown.</p></div>
  <div class="area" id="reportArea" aria-live="polite"></div>

  <div class="hexi-dock">
    <div class="hexi-wrap" id="hexiWrap" style="left: 0px;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <svg id="hexiSvg" width="40" height="40" viewBox="0 0 48 48"></svg>
        <div class="progress-track" id="progressTrack" style="display:none;">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="bubble" id="bubble">
        <p id="bubbleText" style="margin:0 0 4px;"></p>
        <button id="confirmBtn">Automate it</button>
        <button id="dismissBtn">Not now</button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status" id="statusText">Connecting to Hexi...</span>
    <span style="display:flex; gap:6px;">
      <button class="btn" id="handsFreeBtn" title="Simulated Alexa+: the laptop mic acts as an Echo. Say 'Alexa, ask Hexi ...'. In Chrome and Edge the audio is transcribed by the browser vendor's cloud service.">Hey Alexa: off</button>
      <button class="btn" id="voiceBtn" title="Hexi reads its replies aloud">Voice: on</button>
      <button class="btn" id="sfxBtn" title="8-bit sound effects">SFX: on</button>
      <button class="btn" id="resetBtn">Reset demo</button>
    </span>
  </div>

  <div class="echo"><div id="echoRing" data-mode="off"></div><span id="heardLine">Simulated Echo (laptop mic). Turn on "Hey Alexa" and say: Alexa, ask Hexi what's costing me time.</span></div>

  <div class="chatbox">
    <div id="chatLog"></div>
    <div id="chips" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
      <button class="chip">What can I automate?</button>
      <button class="chip">What's costing me time?</button>
      <button class="chip">Brief me</button>
      <button class="chip">Is it worth automating?</button>
      <button class="chip">Why is reporting slow?</button>
      <button class="chip">Stop suggesting bug triage</button>
    </div>
    <div style="display:flex; gap:6px;">
      <input id="chatInput" type="text"
        placeholder="Ask: what's costing me time? why is reporting slow? automate it. stop suggesting bug triage."
        >
      <button class="btn" id="micBtn" title="Speak to Hexi. In Chrome and Edge the audio is sent to the browser vendor's speech service to be transcribed.">Speak</button>
      <button class="btn" id="chatSend">Send</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/speech.js"></script>
<script src="/intents.js"></script>
<script src="/alexa.js"></script>
<script src="/game.js"></script>
<script src="/app.js"></script>
</body>
</html>

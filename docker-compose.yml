services:
  friction-radar:
    build: .
    ports:
      - "127.0.0.1:8000:8000"  # loopback-only by default; widen deliberately if you need remote access
    environment:
      # Binding 0.0.0.0 is required inside the container so Docker's port
      # mapping can reach the process at all. That disables FastMCP's
      # automatic DNS-rebinding protection (it only auto-enables for a
      # loopback host, per the installed SDK), so mcp_server.py requires
      # these two to be set whenever MCP_BIND_HOST isn't loopback -- it
      # will refuse to start otherwise rather than run unprotected.
      MCP_BIND_HOST: "0.0.0.0"
      MCP_ALLOWED_HOSTS: "localhost:8000,127.0.0.1:8000"
      MCP_ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    env_file:
      - path: .env  # cp .env.example .env first -- see .env.example for what it's for
        required: false  # fine to skip entirely; nothing here needs it to run
    volumes:
      - ./data:/app/data  # persist the generated synthetic data across restarts
